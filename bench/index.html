  return (neg ? '-' : '') + group(i.toString()) + (f ? '.' + f : '');

// ───────────── ABI encoding (only the types this bench uses) ─────────────
const hex64 = n => BigInt(n).toString(16).padStart(64, '0');

  const bytes = new TextEncoder().encode(s); let h = '';
  for (const b of bytes) h += b.toString(16).padStart(2, '0');
  return hex64(bytes.length) + h.padEnd(Math.ceil(h.length / 64) * 64, '0');
}

// ───────────── ABI decoding ─────────────
function words(hex) { const h = hex.replace(/^0x/, ''); const o = []; for (let i = 0; i < h.length; i += 64) o.push(h.slice(i, i + 64)); return o; }

  if (t.startsWith('uint')) return BigInt('0x' + w);

  if (!data || data.length < 10) return null;
  const sel = data.slice(2, 10).toLowerCase(); const body = data.slice(10);
  if (sel === '08c379a0') { // Error(string)
    const w = words(body); const len = Number(BigInt('0x' + w[1])); const hx = body.slice(128, 128 + len * 2);
    let s = ''; for (let i = 0; i < hx.length; i += 2) s += String.fromCharCode(parseInt(hx.slice(i, i + 2), 16));
    return { name: 'Error', selector: sel, args: [s] };
  }
  const e = C.errors[sel];
  if (!e) return { name: 'unknown error 0x' + sel, selector: sel, args: [] };
  if (!e.types.every(STATIC)) return { name: e.name, selector: sel, args: ['(raw) 0x' + body] };

// ───────────── RPC (reads go through the local server to the testnet RPC) ─────────────
let rpcId = 0;
async function rpc(method, params, path) {
  const r = await fetch(path || '/rpc', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: ++rpcId, method, params }) });
  return r.json();
}
function findRevertData(err) {
  const seen = new Set(); const stack = [err];
  while (stack.length) {
    const x = stack.pop();
    if (x == null) continue;
    if (typeof x === 'string') { if (/^0x[0-9a-fA-F]{8,}$/.test(x)) return x; continue; }
    if (typeof x === 'object') {
      if (seen.has(x)) continue; seen.add(x);
      if (typeof x.data === 'string' && /^0x[0-9a-fA-F]{8,}$/.test(x.data)) return x.data;
      for (const v of Object.values(x)) stack.push(v);
    }
  }
  return null;
}

  const r = await rpc('eth_call', [tx, block || 'latest']);
  if (r.error) { const d = findRevertData(r.error); return { ok: false, revertData: d, error: decodeError(d), message: r.error.message }; }
  return { ok: true, result: r.result };
}

async function readB(to, data, block) { const r = await readU(to, data, block); return r === null ? null : r !== 0n; }

      data: () => call(C.sel['setFrozenTokens(address,uint256,uint256)'], encAddr(W.Investor), encUint(0), encUint(0)), expect: { status: 1, events: [ev('Frozen', 'Investor', 0n, 0n)] } });
    add('T5a', 'T5', { kind: 'helper', sender: 'Issuer', target: 'token', label: 'pause the token',
      data: () => call(C.sel['pause()']), expect: { status: 1, events: [ev('Paused', 'Issuer')] } });
    add('T5', 'T5', { kind: 'test', sender: 'Investor', target: 'token', move: ['Investor', 'Issuer'], label: 'transfer Investor to Issuer, 1 W3GT (token paused)',
      data: tr('Issuer'), expect: { status: 0, error: ev('EnforcedPause') } });
    add('T5b', 'T5', { kind: 'helper', sender: 'Issuer', target: 'token', label: 'unpause the token',
      data: () => call(C.sel['unpause()']), expect: { status: 1, events: [ev('Unpaused', 'Issuer')] } });
    add('T6', 'T6', { kind: 'test', sender: 'Issuer', target: 'token', move: ['Investor', 'Issuer'], label: 'forcedTransfer Investor to Issuer, 1 W3GT (enforcer)',
      data: () => call(C.sel['forcedTransfer(address,address,uint256)'], encAddr(W.Investor), encAddr(W.Issuer), encUint(U1)),
      expect: { status: 1, events: [ev('Transfer', 'Investor', 'Issuer', U1), ev('ForcedTransfer', 'Investor', 'Issuer', 0n, U1)] } });
    add('T7', 'T7', { kind: 'test', sender: 'Issuer', target: 'token', move: ['Investor', 'Outsider'], label: 'forcedTransfer Investor to Outsider, 1 W3GT (enforcer, Outsider not allowlisted)',
      data: () => call(C.sel['forcedTransfer(address,address,uint256)'], encAddr(W.Investor), encAddr(W.Outsider), encUint(U1)),
      expect: { status: 0, error: ev('CannotReceive', 'Outsider') } });
    add('T8a', 'T8', { kind: 'helper', sender: 'Issuer', target: 'module', label: 'allowlist Outsider',
      data: () => call(C.sel['setAllowlisted(address,bool)'], encAddr(W.Outsider), encBool(true)), expect: { status: 1, events: [ev('AllowlistSet', 'Outsider', true)] } });
    add('T8', 'T8', { kind: 'test', sender: 'Investor', target: 'token', move: ['Investor', 'Outsider'], label: 'transfer Investor to Outsider, 1 W3GT (same call as T2, Outsider now allowlisted)',
      data: tr('Outsider'), expect: { status: 1, events: [ev('Transfer', 'Investor', 'Outsider', U1)] } });
    add('T8b', 'T8', { kind: 'helper', sender: 'Issuer', target: 'module', label: 'remove Outsider from the allowlist',
      data: () => call(C.sel['setAllowlisted(address,bool)'], encAddr(W.Outsider), encBool(false)), expect: { status: 1, events: [ev('AllowlistSet', 'Outsider', false)] } });

}
const STEPS = steps();
const resolveArg = a => (a === 'zero' ? ZERO : (typeof a === 'string' && W[a]) ? lc(W[a]) : a);
const norm = v => typeof v === 'string' ? lc(v) : (typeof v === 'bigint' ? v.toString() : String(v));
function argsEqual(exp, got) { if (exp.length !== got.length) return false; return exp.every((a, i) => norm(resolveArg(a)) === norm(got[i])); }
function expText(step) {
  const x = step.expect;
  if (x.status === 0) return 'fails: ' + `${x.error.name}(${x.error.args.map(a => typeof a === 'bigint' ? a.toString() : (a === 'zero' ? '0x0' : a)).join(', ')})`;
  return 'success' + (x.events && step.kind === 'test' ? ': ' + x.events.map(e => e.name).join(' + ') : '');
}
function targetAddr(step) { if (step.target === 'hashaddr') return '0x' + C.planHash.slice(0, 40); if (step.target === 'zero') return ZERO; if (step.target === 'self') return W[step.sender]; if (step.target === 'token') return S.token; if (step.target === 'module') return S.module; return null; }
function doneRecord(id) { return S.records.find(r => r.step === id && !r.void && r.receipt); }
function nextStep() { return STEPS.find(st => !doneRecord(st.id)); }
function pendingRecord() { return S.records.find(r => !r.void && r.hash && !r.receipt); }

// ───────────── control reads before each test ─────────────
async function controlReads(step) {
  const bnHex = (await rpc('eth_blockNumber', [])).result; const T = S.token, M = S.module;
  const sel = C.sel;
  const from = step.move[0] === 'zero' ? ZERO : W[step.move[0]], to = W[step.move[1]];
  const out = { block: Number(BigInt(bnHex)) };
  out.paused = await readB(T, call(sel['paused()']), bnHex);
  out.compliance = await readA(T, call(sel['compliance()']), bnHex);
  out.frozenInvestor = await readU(T, call(sel['getFrozenTokens(address,uint256)'], encAddr(W.Investor), encUint(0)), bnHex);
  out.availableInvestor = await readU(T, call(sel['availableBalance(address)'], encAddr(W.Investor)), bnHex);
  if (from !== ZERO) out.canSendFrom = await readB(T, call(sel['canSend(address)'], encAddr(from)), bnHex);
  out.canReceiveTo = await readB(T, call(sel['canReceive(address)'], encAddr(to)), bnHex);
  out.canTransfer = await readB(T, call(sel['canTransfer(address,address,uint256)'], encAddr(from), encAddr(to), encUint(U1)), bnHex);
  if (from !== ZERO) out.allowlistedFrom = await readB(M, call(sel['isAllowlisted(address)'], encAddr(from)), bnHex);
  out.allowlistedTo = await readB(M, call(sel['isAllowlisted(address)'], encAddr(to)), bnHex);
  out.balances = {};
  for (const k of ['Issuer', 'Investor', 'Outsider']) out.balances[k] = await readU(T, call(sel['balanceOf(address)'], encAddr(W[k])), bnHex);

}

// ───────────── run one step ─────────────
let currentAcc = null;
async function refreshAcc() {
  if (!window.ethereum) return;
  const a = await window.ethereum.request({ method: 'eth_accounts' });
  currentAcc = a && a[0] ? lc(a[0]) : null;
  const r = currentAcc ? roleOf(currentAcc) : null;
  $('cur').innerHTML = 'MetaMask account: ' + (currentAcc ? (r ? `<b style="color:var(--yellow)">W3 ${r}</b>` : '<span class="bad">not a W3 account</span>') : '<span class="dim">none</span>');
}
async function runStep(step) {
  await refreshAcc();
  if (currentAcc !== lc(W[step.sender])) { banner(`${step.id}: switch MetaMask to W3 ${step.sender}, then click "Run next step".`); return; }
  const rec = { step: step.id, round: step.round || null, test: step.test || null, kind: step.kind, label: step.label, sender: step.sender,
    from: W[step.sender], to: targetAddr(step), gasLimit: step.gas || null, expected: expText(step) };
  if (step.kind !== 'deploy' && !rec.to) throw new Error('Contract for this step is not deployed yet.');
  rec.data = step.data();
  if (step.kind === 'test') {
    banner(`${step.id}: control reads...`);
    rec.pre = await controlReads(step);
  }
  const txc = { from: rec.from, data: rec.data }; if (rec.to) txc.to = rec.to; if (rec.gasLimit) txc.gas = '0x' + rec.gasLimit.toString(16);
  const pf = await ethCall(txc, rec.pre ? '0x' + rec.pre.block.toString(16) : 'latest');
  rec.preflight = pf.ok ? { ok: true } : { ok: false, revertData: pf.revertData, decoded: errText(pf.error) };
  banner(`${step.id}: confirm in MetaMask as W3 ${step.sender}.` + (step.expect.status === 0 ? '\nThis one is expected to fail: MetaMask may warn. Confirm anyway, so it is mined as a failed transaction.' : ''));
  const params = { from: rec.from, data: rec.data, value: '0x0' }; if (rec.to) params.to = rec.to; if (rec.gasLimit) params.gas = '0x' + rec.gasLimit.toString(16);
  let hash;
  try { hash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [params] }); }
  catch (e) {
    rec.void = 'not sent: ' + (e && (e.message || e.code) || 'wallet error'); rec.voidAtUtc = nowUtc();
    S.records.push(rec); await save(rec); render();
    banner(`${step.id}: not sent (${rec.void}). Logged as void. If MetaMask is on another account, switch it to W3 ${step.sender} and run again.`, 'bad');
    return;
  }
  rec.hash = hash; rec.sentAtUtc = nowUtc(); S.records.push(rec); await save(rec); render();
  await finish(rec, step);
}
async function finish(rec, step) {
  banner(`${rec.step}: waiting for the receipt ${short(rec.hash)} ...`);
  let rc = null;
  for (let i = 0; i < 160 && !rc; i++) { const r = await rpc('eth_getTransactionReceipt', [rec.hash]); rc = r.result; if (!rc) await sleep(1500); }
  if (!rc) { banner(`${rec.step}: no receipt yet. Click "Run next step" to check again.`, 'bad'); return; }
  const bn = BigInt(rc.blockNumber);
  const blk = (await rpc('eth_getBlockByNumber', [rc.blockNumber, false])).result;
  rec.receipt = { status: Number(BigInt(rc.status)), blockNumber: Number(bn), gasUsed: Number(BigInt(rc.gasUsed)), contractAddress: rc.contractAddress || null,
    logs: rc.logs.map(l => ({ address: l.address, topics: l.topics, data: l.data })) };
  rec.blockTimeUtc = utc(BigInt(blk.timestamp));
  rec.events = rc.logs.map(l => { const d = decodeLog(l); return { name: d.name, emitter: d.emitter, args: d.args, text: evText(d) }; });
  if (rec.receipt.status === 0) {
    const txc = { from: rec.from, data: rec.data, gas: rec.gasLimit ? '0x' + rec.gasLimit.toString(16) : undefined }; if (rec.to) txc.to = rec.to;
    const rp = await ethCall(txc, '0x' + (bn - 1n).toString(16));
    rec.replay = { block: Number(bn - 1n), revertData: rp.ok ? null : rp.revertData, decoded: rp.ok ? 'replay did not revert' : errText(rp.error), error: rp.ok ? null : rp.error };
  }
  if (step.kind === 'deploy') {
    S[step.what] = rec.receipt.contractAddress;
    const code = (await rpc('eth_getCode', [rec.receipt.contractAddress, 'latest'])).result;
    const art = C[step.what];
    S.b0[step.what + 'Testnet'] = Object.assign({ address: rec.receipt.contractAddress }, compareCode(code, art.runtime, art.immRanges));
  }
  if (step.id === 'S1') {
    const tx = (await rpc('eth_getTransactionByHash', [rec.hash])).result;

  rec.match = judge(rec, step);
  await save(rec); render();
  const res = resultText(rec);
  banner(`${rec.step}  ${rec.label}\nexpected ${rec.expected}\ngot      ${res}\nblock ${group(String(rec.receipt.blockNumber))}, ${rec.blockTimeUtc} UTC   ${rec.match ? 'MATCH' : 'MISMATCH'}`, rec.match ? 'ok' : 'bad');

}
function judge(rec, step) {

    lc(gotE.emitter) === lc(want.name === 'AllowlistSet' ? S.module : S.token)));
  if (!ok) return false;
  if (step.kind === 'deploy') return !!(S.b0[step.what + 'Testnet'] && S.b0[step.what + 'Testnet'].same);
  if (step.id === 'S1') return lc(rec.planHashOnchain || '') === lc('0x' + C.planHash);

}
function resultText(rec) {
  if (rec.void) return 'void (' + rec.void + ')';
  if (!rec.receipt) return 'pending';
  if (rec.receipt.status === 0) return 'failed tx: ' + (rec.replay ? rec.replay.decoded : '?');
  if (rec.receipt.contractAddress) return 'success: deployed at ' + short(rec.receipt.contractAddress);
  const evs = (rec.events || []).filter(e => e.name !== 'unknown event').map(e => e.text);
  return 'success' + (evs.length ? ': ' + evs.join(' + ') : '');

function compareCode(onchain, compiled, ranges) {
  const a = (onchain || '').replace(/^0x/, '').toLowerCase(), b = compiled.replace(/^0x/, '').toLowerCase();

// ───────────── UI ─────────────
function banner(t, cls) { const b = $('banner'); b.textContent = t; b.className = cls || ''; }
function render() {
  // contracts
  const parts = [];
  if (S.module) parts.push(`TestAllowlistModule <a href="${C.explorer}/address/${S.module}" target="_blank">${S.module}</a>`);
  if (S.token) parts.push(`CompliantERC20 ${C.token.symbol} <a href="${C.explorer}/address/${S.token}" target="_blank">${S.token}</a>`);
  $('contracts').innerHTML = parts.length ? parts.join('<br>') : 'contracts: not deployed yet';
  const b0 = [];
  const line = (lbl, r) => r ? `${lbl}: <span class="${r.same ? 'ok' : 'bad'}">${r.same ? 'identical' : 'DIFFERENT'}</span> <span class="dim">outside ${r.immutableRanges} immutable ranges (${group(String(r.bytes))} bytes, ${r.bytesDifferentOutsideImmutables} bytes differ outside)</span>` : '';
  if (S.b0.nf01Mainnet) b0.push(line(`B0a NF01 on mainnet (block ${group(String(S.b0.nf01Mainnet.block))}) vs compiled verified source`, S.b0.nf01Mainnet));
  if (S.b0.tokenTestnet) b0.push(line('B0b testnet W3GT vs the same compiled code', S.b0.tokenTestnet));
  if (S.b0.moduleTestnet) b0.push(line('Test module on testnet vs its compiled code', S.b0.moduleTestnet));
  $('b0').innerHTML = b0.join('<br>');
  // next
  const st = nextStep();
  if (st) {
    $('nextId').textContent = st.id; $('nextLabel').textContent = st.label;
    $('nextDetail').textContent = `sender W3 ${st.sender} | expected ${expText(st)}` + (st.gas ? ` | gas limit ${group(String(st.gas))}` : '');
  } else { $('nextId').textContent = 'done'; $('nextLabel').textContent = 'all 47 steps recorded'; $('nextDetail').textContent = ''; }
  $('run').disabled = busy || !st || holdAfterMismatch || !connected;
  // rows
  $('rows').innerHTML = S.records.slice().reverse().map(r => {
    const link = r.hash ? `<a href="${C.explorer}/tx/${r.hash}" target="_blank">${short(r.hash)}</a>` : '';
    const m = r.void ? '<span class="dim">void</span>' : (r.receipt ? (r.match ? '<span class="ok">MATCH</span>' : '<span class="bad">MISMATCH</span>') : '');
    return `<tr><td>${r.step}</td><td>${r.sender}</td><td>${r.label}</td><td>${r.expected}</td><td>${resultText(r)}</td><td>${r.receipt ? group(String(r.receipt.blockNumber)) : ''}</td><td>${r.blockTimeUtc || ''}</td><td>${link}</td><td>${m}</td></tr>`;
  }).join('');

  $('summary').innerHTML = tests.map(t => {
    const recs = S.records.filter(r => r.test === t && r.kind === 'test' && r.receipt && !r.void);
    const ok = recs.filter(r => r.match).length;
    return `<span>${t} <span class="${recs.length && ok === recs.length ? 'ok' : (recs.length ? 'bad' : 'dim')}">${ok}/${recs.length}</span></span>`;

let connected = false;
async function connect(silent) {
  if (!window.ethereum) { if (!silent) banner('MetaMask not found in this browser.', 'bad'); return; }
  try {
    const before = (await window.ethereum.request({ method: 'eth_accounts' })).map(lc);
    const permitted = before.includes(lc(W.Issuer)) && before.includes(lc(W.Investor));
    if (!permitted) {
      if (silent) return;
      try { await window.ethereum.request({ method: 'wallet_requestPermissions', params: [{ eth_accounts: {} }] }); }
      catch (e) { if (e && e.code === 4001) throw e; await window.ethereum.request({ method: 'eth_requestAccounts' }); }
    }
    let cid = await window.ethereum.request({ method: 'eth_chainId' });
    if (lc(cid) !== C.chainIdHex) {
      try { await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: C.chainIdHex }] }); } catch (e) { }
      cid = await window.ethereum.request({ method: 'eth_chainId' });
    }
    const accs = (await window.ethereum.request({ method: 'eth_accounts' })).map(lc);
    let all = true;
    for (const k of ['Issuer', 'Investor', 'Outsider']) {
      const has = accs.includes(lc(W[k])); if (!has && k !== 'Outsider') all = false;
      $('con-' + k).innerHTML = has ? '<span class="ok">connected</span>' : (k === 'Outsider' ? '<span class="dim">(never sends)</span>' : '<span class="bad">not connected</span>');
    }
    const extra = accs.filter(a => !roleOf(a)).length;
    $('extra').innerHTML = extra ? `<span class="bad">${extra} other account(s) connected. Disconnect them in MetaMask.</span>` : '';
    const netOk = lc(cid) === C.chainIdHex;
    $('net').innerHTML = netOk ? '<span class="ok">Rayls Testnet</span>' : '<span class="bad">wrong network in MetaMask</span>';
    connected = netOk && all && extra === 0;
    await balances(); await refreshAcc(); render();
    if (window.ethereum.on && !connect.hooked) { connect.hooked = true; window.ethereum.on('accountsChanged', () => refreshAcc()); window.ethereum.on('chainChanged', () => location.reload()); }
    if (!connected) banner('Connect W3 Issuer and W3 Investor (only the W3 accounts) on Rayls Testnet.', 'bad'); else banner('Ready.');
  } catch (e) { banner('Connection failed: ' + (e.message || e.code), 'bad'); }
}
async function balances() {
  for (const k of ['Issuer', 'Investor', 'Outsider']) {
    const r = await rpc('eth_getBalance', [W[k], 'latest']);
    if (r.result) $('bal-' + k).textContent = fmtUnits(BigInt(r.result), 18) + ' USDr';
  }
}
async function endState() {
  if (!S.token || nextStep()) { $('endstate').innerHTML = ''; return; }
  const T = S.token, sel = C.sel; const bnHex = (await rpc('eth_blockNumber', [])).result;
  const got = { block: Number(BigInt(bnHex)) };
  for (const k of ['Investor', 'Issuer', 'Outsider']) got[k] = await readU(T, call(sel['balanceOf(address)'], encAddr(W[k])), bnHex);
  got.totalSupply = await readU(T, call(sel['totalSupply()']), bnHex);
  got.paused = await readB(T, call(sel['paused()']), bnHex);
  got.frozenInvestor = await readU(T, call(sel['getFrozenTokens(address,uint256)'], encAddr(W.Investor), encUint(0)), bnHex);
  got.outsiderAllowlisted = await readB(S.module, call(sel['isAllowlisted(address)'], encAddr(W.Outsider)), bnHex);
  const want = { Investor: 991n * U1, Issuer: 6n * U1, Outsider: 3n * U1, totalSupply: 1000n * U1, paused: false, frozenInvestor: 0n, outsiderAllowlisted: false };
  const ok = Object.keys(want).every(k => norm(want[k]) === norm(got[k]));

  $('endstate').innerHTML = `End state at block ${group(String(got.block))}: Investor ${fmtUnits(got.Investor, 6)}, Issuer ${fmtUnits(got.Issuer, 6)}, Outsider ${fmtUnits(got.Outsider, 6)} W3GT, supply ${fmtUnits(got.totalSupply, 6)}, paused ${got.paused}, frozen ${fmtUnits(got.frozenInvestor, 6)}, Outsider allowlisted ${got.outsiderAllowlisted} <span class="${ok ? 'ok' : 'bad'}">${ok ? 'MATCH (plan: 991 / 6 / 3 / 1,000)' : 'MISMATCH'}</span>`;
}
async function runNext() {
  if (busy) return; busy = true; render();
  try {
    const p = pendingRecord();
    if (p) await finish(p, STEPS.find(s => s.id === p.step));
    else { const st = nextStep(); if (st) await runStep(st); }
    await balances(); await endState();
  } catch (e) { banner('Error: ' + (e.message || e), 'bad'); }

}
async function b0a() {
  const bn = (await rpc('eth_blockNumber', [], '/rpc-mainnet')).result;
  const r = await rpc('eth_getCode', [C.nf01.address, bn], '/rpc-mainnet');
  if (!r.result) { banner('Mainnet read failed: ' + JSON.stringify(r.error || r), 'bad'); return; }
  S.b0.nf01Mainnet = Object.assign({ address: C.nf01.address, block: Number(BigInt(bn)) }, compareCode(r.result, C.token.runtime, C.token.immRanges));

function download() {
  const blob = new Blob([JSON.stringify(S, replacer, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bench-log.json'; a.click();

setInterval(() => { $('clock').textContent = nowUtc() + ' UTC'; }, 500);
$('connect').onclick = () => connect(false); $('run').onclick = runNext; $('dl').onclick = download; $('b0a').onclick = () => b0a().catch(e => banner('B0a error: ' + e.message, 'bad'));

$('wallets').innerHTML = ['Issuer', 'Investor', 'Outsider'].map(k => `<span class="w"><b>W3 ${k}</b> <span class="dim">${short(W[k])}</span> <span id="bal-${k}" class="dim"></span> <span id="con-${k}"></span></span>`).join('');
(async () => {
  try { const r = await fetch('/log'); const j = await r.json(); if (j && j.format === 'w3-bench-log-1') S = j; } catch (e) { }
  render(); await connect(true); await endState();
})();
